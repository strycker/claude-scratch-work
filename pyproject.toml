[build-system]
requires = ["setuptools>=68,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-crab"
version = "0.1.2"
description = "Market regime classification pipeline — CLI and pipeline orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{ name = "Strycker" }]
keywords = ["finance", "trading-crab", "macroeconomics", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "trading-crab-lib>=0.1.2",   # the library this app wraps
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
tradingcrab         = "trading_crab.cli:run_pipeline"
tradingcrab-setup   = "trading_crab.cli:setup"
tradingcrab-publish = "trading_crab.cli:publish_notebooks"

[project.urls]
Homepage   = "https://github.com/strycker/trading-crab"
Repository = "https://github.com/strycker/trading-crab"
Issues     = "https://github.com/strycker/trading-crab/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ipykernel",
    "jupyterlab",
    "flake8",
    "ruff>=0.4",
]

# Find only the app package; the library has its own pyproject.toml
[tool.setuptools.packages.find]
where   = ["src"]
include = ["trading_crab"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src", "scripts"]
filterwarnings = [
    # statsmodels MarkovRegression emits numpy overflow warnings during
    # optimization on synthetic test data — harmless numerical artefacts.
    "ignore::RuntimeWarning:statsmodels",
    # statsmodels warns when a DatetimeIndex has no associated frequency.
    # Use message-pattern match so the filter works even without statsmodels installed.
    "ignore:A date index has been provided:UserWarning",
    # numpy overflow inside statsmodels optimization — same root cause.
    "ignore:invalid value encountered in reduce:RuntimeWarning",
    "ignore:divide by zero encountered:RuntimeWarning",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
# Not strict yet — enable incrementally as type coverage improves.
# Next targets: warn_return_any, warn_unreachable, disallow_untyped_defs.

[tool.ruff]
line-length = 127
target-version = "py310"
exclude = [
    "gsd-scratch-work",
    "trading-crab-lib",
    "legacy",
    ".venv",
]

[tool.ruff.lint]
# E/W: pycodestyle errors/warnings  F: pyflakes  I: isort  UP: pyupgrade
select = ["E", "F", "W", "I", "UP"]
# E741: ambiguous variable name (l, O, I) — common in ML/math code
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Tests freely shadow/re-import fixtures
"tests/**/*.py" = ["F811"]

# uv workspace: editable-installs both packages with a single `uv sync`
[tool.uv.workspace]
members = ["src/trading_crab_lib"]

# ── Poetry ──────────────────────────────────────────────────────────────────
# Poetry 2.x reads [project] for metadata. This section adds Poetry-specific
# overrides — in particular, the path dependency for trading-crab-lib so that
# `poetry install` installs the library from source instead of PyPI.
#
# pip / uv use [project.dependencies] (trading-crab-lib>=0.1.2).
# Poetry uses [tool.poetry.dependencies] (path dep below).
#
# To set up locally with Poetry:
#   pip install poetry
#   poetry install                  # installs lib (path) + app + dev deps
#   poetry run pytest tests/ -v
#   poetry run tradingcrab --help
#
# To regenerate the lock file after dependency changes:
#   poetry lock

[tool.poetry]
name = "trading-crab"
packages = [{include = "trading_crab", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# Install library as editable path dep (overrides [project.dependencies] for Poetry).
trading-crab-lib = {path = "src/trading_crab_lib", develop = true}
pyyaml = ">=6.0"
python-dotenv = ">=1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = "*"
ipykernel = "*"
jupyterlab = "*"
flake8 = "*"
ruff = ">=0.4"
pylint = ">=3.0"
mypy = ">=1.0"
