[build-system]
requires = ["setuptools>=68,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-crab-lib"
version = "0.1.5"
description = "Market regime classification library — transforms, clustering, prediction, reporting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{ name = "Strycker" }]
keywords = ["finance", "clustering", "macroeconomics", "machine-learning", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core deps: pure data science + ML — no network/API/viz
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage   = "https://github.com/strycker/trading-crab"
Repository = "https://github.com/strycker/trading-crab"
Issues     = "https://github.com/strycker/trading-crab/issues"
Changelog  = "https://github.com/strycker/trading-crab/blob/main/STATE.md"

[project.optional-dependencies]
ingestion = [
    "fredapi>=0.5",
    "requests>=2.31",
    "lxml>=4.9",
    "cssselect>=1.2",
    "beautifulsoup4>=4.12",
    "yfinance>=0.2",
    "curl_cffi>=0.5",
    "html5lib>=1.1",
    "certifi>=2024.0",
]
plotting = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
hmm = [
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
]
clustering-extras = [
    "hdbscan>=0.8",
    "kneed>=0.8",
]
boosting = [
    "lightgbm>=4.0",
]
# Headless-browser rendering for JS-gated sources (ingestion/browser.py).
# Two engines: Playwright is the primary engine (requires `playwright install
# chromium` once after installing this extra — the wheel ships no browser
# binaries); Selenium is a fallback for when Playwright is unavailable or its
# installed package mismatches the ambient Chromium build — NOT a second
# attempt at a block Playwright could not pass (see browser.py's docstring).
# Selenium additionally requires a Chrome/Chromium binary + matching driver
# on PATH; neither is bundled by this extra.
browser = [
    "playwright>=1.40",
    "selenium>=4.15",
]
all = [
    "trading-crab-lib[ingestion,plotting,hmm,clustering-extras,boosting,browser]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "flake8",
    "ruff>=0.4",
]

# This pyproject.toml lives INSIDE the package: src/trading_crab_lib/ is simultaneously
# the project root AND the package's own content directory (a flat layout). There is
# therefore nothing for `packages.find` to discover from here.
#
# DO NOT reintroduce a discovery glob. The previous config used
#     [tool.setuptools.packages.find] where = [".."]
# to re-discover the package one level up. Modern setuptools refuses to let `where`
# escape the project root, so it silently returned an EMPTY package list and the build
# exited 0 — shipping metadata-only wheels containing zero Python modules to PyPI for
# every release 0.1.0 through 0.1.4. Neither `twine check` (validates metadata) nor
# `python -m build` succeeding can detect that; only installing the wheel and importing
# it can. See docs/RELEASING.md.
#
# Map the package name to "." explicitly and enumerate subpackages.
[tool.setuptools]
package-dir = {"trading_crab_lib" = "."}
packages = [
    "trading_crab_lib",
    "trading_crab_lib.ingestion",
    "trading_crab_lib.monitoring",
    "trading_crab_lib.platform",
    "trading_crab_lib.platform.allocation",
    "trading_crab_lib.platform.assets",
    "trading_crab_lib.platform.backtest",
    "trading_crab_lib.platform.evaluation",
    "trading_crab_lib.platform.honesty",
    "trading_crab_lib.platform.ingestion",
    "trading_crab_lib.platform.labeling",
    "trading_crab_lib.platform.plotting",
    "trading_crab_lib.platform.prediction",
    "trading_crab_lib.platform.report",
    "trading_crab_lib.platform.tripwire",
    "trading_crab_lib.plotting",
    "trading_crab_lib.prediction",
]

[tool.setuptools.package-data]
trading_crab_lib = ["py.typed"]

# ── Poetry ──────────────────────────────────────────────────────────────────
# When working on the library in isolation, run from src/trading_crab_lib/:
#   poetry install -E all        # installs core + all optional extras
#   poetry run pytest ../../tests/unit/ -v
#
# From the repo root, `poetry install` installs this package as a path dep
# automatically — you don't need to run poetry install here separately.

[tool.poetry]
name = "trading-crab-lib"
readme = "README.md"
packages = [{include = "trading_crab_lib", from = ".."}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.0"
numpy = ">=1.25"
pyarrow = ">=14.0"
scikit-learn = ">=1.4"
scipy = ">=1.11"
pyyaml = ">=6.0"
joblib = ">=1.3"
python-dotenv = ">=1.0"

# Optional dependency groups mirror [project.optional-dependencies].
# Install with: poetry install -E ingestion -E plotting  (or -E all)
[tool.poetry.group.ingestion]
optional = true

[tool.poetry.group.ingestion.dependencies]
fredapi = ">=0.5"
requests = ">=2.31"
lxml = ">=4.9"
cssselect = ">=1.2"
beautifulsoup4 = ">=4.12"
yfinance = ">=0.2"
certifi = ">=2024.0"

[tool.poetry.group.plotting]
optional = true

[tool.poetry.group.plotting.dependencies]
matplotlib = ">=3.8"
seaborn = ">=0.13"

[tool.poetry.group.hmm]
optional = true

[tool.poetry.group.hmm.dependencies]
hmmlearn = ">=0.3"
statsmodels = ">=0.14"

[tool.poetry.group.clustering-extras]
optional = true

[tool.poetry.group.clustering-extras.dependencies]
hdbscan = ">=0.8"
kneed = ">=0.8"

[tool.poetry.group.boosting]
optional = true

[tool.poetry.group.boosting.dependencies]
lightgbm = ">=4.0"

[tool.poetry.group.browser]
optional = true

[tool.poetry.group.browser.dependencies]
playwright = ">=1.40"
selenium = ">=4.15"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = "*"
flake8 = "*"
ruff = ">=0.4"
