# Publish both packages to PyPI from a single workflow using a matrix.
#
# Tag conventions:
#   lib-v0.1.3  → publishes trading-crab-lib only
#   v0.1.3      → publishes trading-crab (app) only
#   both-v0.1.3 → publishes both in one run (useful when versions are in sync)
#
# Every artifact is validated with `twine check --strict` before upload. A
# package missing README/long_description metadata now fails the job here
# instead of silently rendering a blank PyPI project page after a real,
# irreversible publish.
#
# workflow_dispatch runs carry a `target` input (default "testpypi", the
# safe rehearsal choice) that lets an operator upload to TestPyPI instead
# of production without changing anything else about the run. A tag push
# always targets production PyPI regardless of this input, because a tag
# push has no `target` input to read at all — see docs/RELEASING.md for
# the full walkthrough.
#
# Requires three repository secrets:
#   PYPI_LIB_TOKEN      — API token scoped to trading-crab-lib
#   PYPI_APP_TOKEN      — API token scoped to trading-crab
#   TEST_PYPI_API_TOKEN — TestPyPI token shared by both packages for
#                          workflow_dispatch dry runs (not used for
#                          tag-triggered publishes)

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
      - "lib-v*"
      - "both-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish"
        required: true
        default: "both"
        type: choice
        options: ["lib", "app", "both"]
      target:
        description: "Upload target: 'testpypi' is a safe rehearsal upload; 'pypi' is a real publish"
        required: true
        default: "testpypi"
        type: choice
        options: ["testpypi", "pypi"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trading-crab-lib
            build_dir: src/trading_crab_lib
            secret_name: PYPI_LIB_TOKEN
            tag_prefix: lib-v
          - name: trading-crab
            build_dir: .
            secret_name: PYPI_APP_TOKEN
            tag_prefix: v

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Decide whether to publish this package
        id: gate
        env:
          PKG: ${{ matrix.name }}
          TAG_PREFIX: ${{ matrix.tag_prefix }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PKG: ${{ github.event.inputs.package }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET="$INPUT_TARGET"
          else
            TARGET="pypi"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "TARGET: $PKG will publish to '$TARGET' (event=$EVENT_NAME)"

          TAG="${GITHUB_REF#refs/tags/}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_PKG" == "both" || "$INPUT_PKG" == "lib" && "$PKG" == "trading-crab-lib" || "$INPUT_PKG" == "app" && "$PKG" == "trading-crab" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "PUBLISH: $PKG via workflow_dispatch (input=$INPUT_PKG)"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "SKIP: $PKG tag=(workflow_dispatch) prefix=$TAG_PREFIX reason=workflow_dispatch input '$INPUT_PKG' does not select this package"
            fi
          elif [[ "$TAG" == both-v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "PUBLISH: $PKG tag=$TAG"
          elif [[ "$TAG" == ${TAG_PREFIX}* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "PUBLISH: $PKG tag=$TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: $PKG tag=$TAG prefix=$TAG_PREFIX reason=tag does not match this package's prefix or the both-v prefix"
          fi

      - name: Check PyPI token is present
        if: steps.gate.outputs.publish == 'true'
        env:
          PKG: ${{ matrix.name }}
          TARGET: ${{ steps.gate.outputs.target }}
          SECRET_NAME: ${{ steps.gate.outputs.target == 'testpypi' && 'TEST_PYPI_API_TOKEN' || matrix.secret_name }}
          TWINE_PASSWORD: ${{ secrets[ steps.gate.outputs.target == 'testpypi' && 'TEST_PYPI_API_TOKEN' || matrix.secret_name ] }}
        run: |
          set -euo pipefail

          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "ERROR: PyPI token for $PKG (target: $TARGET) is missing or empty." >&2
            echo "Expected secret name: $SECRET_NAME." >&2
            echo "It must be defined either as a repository secret, or as an environment secret on the 'pypi' environment." >&2
            echo "Note: GitHub's dynamic secrets[...] lookup resolves an unknown or mistyped secret name to an empty string rather than erroring, so an exact-name typo looks identical to an absent secret. Double-check the name is exactly '$SECRET_NAME'." >&2
            exit 1
          fi

          echo "Token present for $PKG (target: $TARGET) (secret: $SECRET_NAME) - value intentionally not shown."

      - name: Set up Python
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        if: steps.gate.outputs.publish == 'true'
        run: python -m pip install --upgrade pip build twine

      - name: Build ${{ matrix.name }}
        if: steps.gate.outputs.publish == 'true'
        run: python -m build ${{ matrix.build_dir }}

      - name: Verify built artifacts
        if: steps.gate.outputs.publish == 'true'
        env:
          PKG: ${{ matrix.name }}
          BUILD_DIR: ${{ matrix.build_dir }}
          TAG_PREFIX: ${{ matrix.tag_prefix }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          ARTIFACTS=("$BUILD_DIR"/dist/*)
          if [ ${#ARTIFACTS[@]} -eq 0 ]; then
            echo "ERROR: no artifacts found in $BUILD_DIR/dist" >&2
            exit 1
          fi
          echo "Found ${#ARTIFACTS[@]} artifact(s) in $BUILD_DIR/dist:"
          for f in "${ARTIFACTS[@]}"; do
            echo "  $f"
          done

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch run: no tag to compare against, skipping version check"
            exit 0
          fi

          TAG="${GITHUB_REF#refs/tags/}"
          BOTH_PREFIX="both-v"
          PREFIX="$TAG_PREFIX"
          if [[ "$TAG" == ${BOTH_PREFIX}* ]]; then
            TAG_VERSION="${TAG#$BOTH_PREFIX}"
          else
            TAG_VERSION="${TAG#$PREFIX}"
          fi

          for f in "${ARTIFACTS[@]}"; do
            BASENAME=$(basename "$f")
            case "$BASENAME" in
              *.whl)
                ARTIFACT_VERSION=$(echo "$BASENAME" | cut -d- -f2)
                ;;
              *.tar.gz)
                STEM="${BASENAME%.tar.gz}"
                ARTIFACT_VERSION="${STEM##*-}"
                ;;
              *)
                echo "ERROR: unrecognized artifact extension: $BASENAME" >&2
                exit 1
                ;;
            esac
            if [[ "$ARTIFACT_VERSION" != "$TAG_VERSION" ]]; then
              echo "ERROR: version mismatch for $PKG: artifact $BASENAME has version $ARTIFACT_VERSION but tag $TAG implies version $TAG_VERSION. Bump the version in this package's pyproject.toml or retag." >&2
              exit 1
            fi
          done

          echo "All artifacts match expected version $TAG_VERSION"

      - name: Check package metadata with twine
        if: steps.gate.outputs.publish == 'true'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euo pipefail
          twine check --strict "$BUILD_DIR"/dist/*

      - name: Publish ${{ matrix.name }} to PyPI
        if: steps.gate.outputs.publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets[ steps.gate.outputs.target == 'testpypi' && 'TEST_PYPI_API_TOKEN' || matrix.secret_name ] }}
          TWINE_REPOSITORY_URL: ${{ steps.gate.outputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
        run: |
          DIST_DIR="${{ matrix.build_dir }}/dist"
          twine upload --skip-existing "$DIST_DIR"/*
