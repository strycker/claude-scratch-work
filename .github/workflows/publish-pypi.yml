# Publish both packages to PyPI from a single workflow using a matrix.
#
# Tag conventions:
#   lib-v0.1.3  → publishes trading-crab-lib only
#   v0.1.3      → publishes trading-crab (app) only
#   both-v0.1.3 → publishes both in one run (useful when versions are in sync)
#
# Requires two repository secrets:
#   PYPI_LIB_TOKEN  — API token scoped to trading-crab-lib
#   PYPI_APP_TOKEN  — API token scoped to trading-crab

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
      - "lib-v*"
      - "both-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish"
        required: true
        default: "both"
        type: choice
        options: ["lib", "app", "both"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trading-crab-lib
            build_dir: src/trading_crab_lib
            secret_name: PYPI_LIB_TOKEN
            tag_prefix: lib-v
          - name: trading-crab
            build_dir: .
            secret_name: PYPI_APP_TOKEN
            tag_prefix: v

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Decide whether to publish this package
        id: gate
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EVENT="${{ github.event_name }}"
          PKG="${{ matrix.name }}"
          PREFIX="${{ matrix.tag_prefix }}"
          INPUT="${{ github.event.inputs.package }}"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$INPUT" == "both" || "$INPUT" == "lib" && "$PKG" == "trading-crab-lib" || "$INPUT" == "app" && "$PKG" == "trading-crab" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$TAG" == both-v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == ${PREFIX}* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        if: steps.gate.outputs.publish == 'true'
        run: python -m pip install --upgrade pip build twine

      - name: Build ${{ matrix.name }}
        if: steps.gate.outputs.publish == 'true'
        run: python -m build ${{ matrix.build_dir }}

      - name: Publish ${{ matrix.name }} to PyPI
        if: steps.gate.outputs.publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets[matrix.secret_name] }}
        run: |
          DIST_DIR="${{ matrix.build_dir == '.' && 'dist' || matrix.build_dir }}/dist"
          twine upload --skip-existing "$DIST_DIR"/*
