# Publish trading-crab-lib to PyPI when a lib-v* tag is pushed.
# Example: git tag lib-v0.1.2 && git push --tags

name: Publish trading-crab-lib

on:
  push:
    tags:
      - "lib-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: python -m pip install --upgrade pip build twine

    - name: Build library package
      run: python -m build src/trading_crab_lib/

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_LIB_TOKEN }}
      run: twine upload src/trading_crab_lib/dist/*
