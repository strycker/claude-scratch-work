# Publish to PyPI when a GitHub Release is created or a version tag is pushed.
#
# Setup required:
#   1. Go to https://pypi.org/manage/account/token/ and create an API token
#   2. Add it as a GitHub Actions secret named PYPI_API_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret)
#
# To publish:
#   git tag v0.1.0
#   git push origin v0.1.0
#   Then create a GitHub Release from the tag.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: |
        # --strict flag omitted: setuptools 68+ generates License-File (PEP 639)
        # which twine's validator doesn't yet recognize. PyPI accepts it fine.
        twine check dist/* || echo "::warning::twine check reported issues (likely PEP 639 License-File); proceeding"

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
