# Publish trading-crab (app) to PyPI when a v* tag is pushed.
# Example: git tag v0.1.2 && git push --tags

name: Publish trading-crab

on:
  push:
    tags:
      - "v*"
      - "!lib-v*"   # exclude lib tags

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: python -m pip install --upgrade pip build twine

    - name: Build app package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_APP_TOKEN }}
      run: twine upload dist/*
